# Local host inventory — EXAMPLE
#
# Copy to `local/hosts.yaml` and fill in your real values. `local/` is gitignored
# except for this example file, so real hosts, IPs, ports, key paths and
# fingerprints never reach the repository.
#
# Skills reference these by ALIAS only. A skill that hardcodes an IP cannot be
# shared, and breaks the moment the endpoint moves (per-boot ports on some
# container platforms change between sessions).

default_proxy: "http://127.0.0.1:7897"

hosts:
  - alias: ubuntu20
    # Some container platforms assign the public port per boot; the port CHANGES
    # between sessions. Re-read it from the platform console when it moves.
    hostname: "<public-ip>"
    port: 0
    user: root
    identity_file: "$HOME/.ssh/id_ed25519_<alias>"
    expected_hostname: "<remote-hostname>"
    expected_os: "Ubuntu 20.04"
    notes: ""

  - alias: ubuntu24
    hostname: "<public-ip>"
    port: 0
    user: root
    identity_file: "$HOME/.ssh/id_ed25519_<alias>"
    expected_hostname: "<remote-hostname>"
    expected_os: "Ubuntu 24.04"
    notes: ""

# SSH config blocks are NOT generated by this repo. Write them into
# $HOME/.ssh/config yourself, then verify with:
#
#   ssh -o BatchMode=yes -o ConnectTimeout=10 <alias> 'hostname; grep PRETTY_NAME /etc/os-release'
#
# Keys stay out of this repository entirely. Preferred workflow on a new machine:
# generate a fresh keypair locally and append its PUBLIC key to the server's
# ~/.ssh/authorized_keys. Never transport a private key through git or a shared archive.
