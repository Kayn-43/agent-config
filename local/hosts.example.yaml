# 本机主机清单 —— 示例文件
#
# 复制为 `local/hosts.yaml` 后填入真实值。`local/` 目录被 gitignore（本示例文件除外），
# 所以真实主机、IP、端口、密钥路径和指纹都不会进入仓库。
#
# 技能只按“别名”引用这些主机。写死 IP 的技能无法共享，而且端点一变动就失效
# （某些容器平台的公网端口按每次启动分配，会变）。

default_proxy: "http://127.0.0.1:7897"

hosts:
  - alias: ubuntu20
    # 部分容器平台的公网端口按每次启动重新分配，**会变**。
    # 端口变动时去平台控制台读取当前值。
    hostname: "<公网IP>"
    port: 0
    user: root
    identity_file: "$HOME/.ssh/id_ed25519_<alias>"
    expected_hostname: "<远端主机名>"
    expected_os: "Ubuntu 20.04"
    notes: ""

  - alias: ubuntu24
    hostname: "<公网IP>"
    port: 0
    user: root
    identity_file: "$HOME/.ssh/id_ed25519_<alias>"
    expected_hostname: "<远端主机名>"
    expected_os: "Ubuntu 24.04"
    notes: ""

# 本仓库不生成 SSH 配置段。请自行写入 $HOME/.ssh/config，然后用下面的命令核实：
#
#   ssh -o BatchMode=yes -o ConnectTimeout=10 <alias> 'hostname; grep PRETTY_NAME /etc/os-release'
#
# 密钥完全不进本仓库。新机器的推荐做法：在本机生成一对新密钥，把**公钥**追加到
# 服务器的 ~/.ssh/authorized_keys。绝不要通过 git 或共享压缩包传输私钥。
